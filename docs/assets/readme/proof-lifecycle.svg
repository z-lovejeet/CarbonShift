<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Content commitment and portable proof lifecycle</title><desc id="desc">Explicit consent authorizes a public copy. Versioned canonical bytes are hashed and recorded by an operator-issued Sepolia contract. A local verifier checks seven distinct evidence layers.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#165D3B"/></marker></defs>
<rect width="1200" height="710" rx="20" fill="#F7F8F4"/>
<text x="48" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#165D3B" text-anchor="start" letter-spacing="1.7">BLOCKCHAIN &amp; PROOF</text>
<text x="48" y="91" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17261E" text-anchor="start" letter-spacing="-0.8">Commit the record. Preserve the history.</text>
<text x="48" y="124" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526158" text-anchor="start">Operator-issued Sepolia commitments bind content and chronology, not physical appliance behavior.</text>
<rect x="48" y="166" width="258" height="139" rx="14" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="68" y="202" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17261E" text-anchor="start">Accepted plan</text>
<text x="68" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526158" text-anchor="start">Preserved private inputs</text>
<text x="68" y="259" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526158" text-anchor="start">and forecast snapshot.</text>
<rect x="330" y="166" width="258" height="139" rx="14" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="350" y="202" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17261E" text-anchor="start">Exact preview</text>
<text x="350" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526158" text-anchor="start">Review every field before</text>
<text x="350" y="259" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526158" text-anchor="start">lasting public disclosure.</text>
<rect x="612" y="166" width="258" height="139" rx="14" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="632" y="202" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17261E" text-anchor="start">Consent + worker</text>
<text x="632" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526158" text-anchor="start">Persist operation, sign,</text>
<text x="632" y="259" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526158" text-anchor="start">broadcast and reconcile.</text>
<rect x="894" y="166" width="258" height="139" rx="14" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="914" y="202" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17261E" text-anchor="start">Contract record</text>
<text x="914" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526158" text-anchor="start">Plan + method hashes,</text>
<text x="914" y="259" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526158" text-anchor="start">issuer and cutoff timing.</text>
<path d="M306 235 H330" fill="none" stroke="#165D3B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M588 235 H612" fill="none" stroke="#165D3B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M870 235 H894" fill="none" stroke="#165D3B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="337" width="1104" height="135" rx="14" fill="#EEF2E9" stroke="#D7DFD6"/>
<text x="70" y="374" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#165D3B" text-anchor="start">VERSIONED CANONICAL JSON  →  DOMAIN-SEPARATED SHA-256  →  CONTENT COMMITMENT</text>
<text x="70" y="411" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17261E" text-anchor="start">Result revisions link their previous result hash. Corrections append; the accepted plan stays unchanged.</text>
<text x="70" y="444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526158" text-anchor="start">The public bundle carries the disclosed inputs needed to reproduce the record.</text>
<text x="48" y="516" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#165D3B" text-anchor="start" letter-spacing="1">SEVEN SEPARATE VERIFIER CHECKS</text>
<rect x="48" y="540" width="150" height="78" rx="10" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="123" y="572" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#17261E" text-anchor="middle">Format</text>
<text x="123" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526158" text-anchor="middle">and limits</text>
<rect x="207" y="540" width="150" height="78" rx="10" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="282" y="572" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#17261E" text-anchor="middle">Recorded</text>
<text x="282" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526158" text-anchor="middle">commitment</text>
<rect x="366" y="540" width="150" height="78" rx="10" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="441" y="572" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#17261E" text-anchor="middle">Known</text>
<text x="441" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526158" text-anchor="middle">method</text>
<rect x="525" y="540" width="150" height="78" rx="10" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="600" y="572" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#17261E" text-anchor="middle">Reproducible</text>
<text x="600" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526158" text-anchor="middle">calculations</text>
<rect x="684" y="540" width="150" height="78" rx="10" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="759" y="572" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#17261E" text-anchor="middle">Commitment</text>
<text x="759" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526158" text-anchor="middle">timing</text>
<rect x="843" y="540" width="150" height="78" rx="10" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="918" y="572" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#17261E" text-anchor="middle">Revision</text>
<text x="918" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526158" text-anchor="middle">history</text>
<rect x="1002" y="540" width="150" height="78" rx="10" fill="#FFFFFF" stroke="#D7DFD6"/>
<text x="1077" y="572" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#17261E" text-anchor="middle">Evidence</text>
<text x="1077" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526158" text-anchor="middle">disclosures</text>
<text x="48" y="661" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526158" text-anchor="start">Without valid chain observations, chain-dependent checks remain unavailable. There is no universal impact certificate.</text>
</svg>
