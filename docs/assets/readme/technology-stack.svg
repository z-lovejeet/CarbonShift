<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-labelledby="title desc">
<title id="title">CarbonShift technology stack</title><desc id="desc">The project uses a TypeScript web and domain stack, Supabase persistence, Gemini/Groq assistance and a separate Solidity/Viem Sepolia publication worker.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#165D3B"/></marker></defs>
